<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">

  <title>Agenda — CHAINED</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="agenda.css">
  <link rel="stylesheet" href="auth/auth.css">

  <script type="module" src="auth/guard.mjs"></script>
</head>

<body class="agenda-page" data-auth-protected="true">

  <header class="site-header">
    <a class="wordmark" href="discover.html">
      &lt;CHAINED&gt;
    </a>

    <nav
      class="main-nav main-nav-with-dashboard"
      aria-label="Primary navigation">
      <a href="discover.html">DISCOVER</a>
      <a href="following.html">FOLLOWING</a>
      <a href="archive.html">ARCHIVE</a>
      <a class="is-active" href="agenda.html">AGENDA</a>

      <span class="profile-nav-group">
        <a data-own-profile-link href="profile.html">PROFILE</a>

        <a
          class="dashboard-link"
          href="dashboard.html"
          aria-label="Open dashboard">
          +
        </a>
      </span>
    </nav>
  </header>


  <main class="agenda-layout">

    <aside class="agenda-sidebar">
      <div class="agenda-sidebar-inner">

        <section class="agenda-sidebar-section">
          <h1>AGENDA</h1>

          <p class="agenda-status">
            CURRENT + UPCOMING
          </p>
        </section>


        <section
          class="agenda-sidebar-section"
          id="agenda-city-section"
          hidden>
          <h2>FILTER BY CITY</h2>

          <div id="agenda-city-filters"></div>
        </section>


        <section
          class="agenda-sidebar-section"
          id="agenda-type-section"
          hidden>
          <h2>FILTER BY TYPE</h2>

          <div id="agenda-type-filters"></div>
        </section>


        <button
          class="text-action agenda-clear"
          id="agenda-clear"
          type="button"
          hidden>
          [ CLEAR FILTERS ]
        </button>

      </div>
    </aside>


    <section class="agenda-content">

      <header class="agenda-content-header">

        <div>
          <p class="agenda-current-view">
            ALL EVENTS
          </p>

          <p
            class="agenda-result-count"
            id="agenda-result-count">
            LOADING
          </p>
        </div>

        <label class="agenda-search">
          <span class="sr-only">
            Search agenda
          </span>

          <input
            id="agenda-search"
            type="search"
            placeholder="SEARCH AGENDA"
            autocomplete="off">
        </label>

      </header>


      <div
        id="agenda-results"
        aria-live="polite"
        aria-busy="true">
        <p class="agenda-empty">
          LOADING AGENDA
        </p>
      </div>

    </section>

  </main>

  <script type="module" src="agenda.js"></script>

</body>
</html>
