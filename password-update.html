<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">

  <title>Set Password — CHAINED</title>

  <link rel="stylesheet" href="styles.css">
  <script src="scroll-indicators.js" defer></script>
  <link rel="stylesheet" href="auth/auth.css">
</head>

<body class="auth-page">
  <header class="site-header">
    <a class="wordmark" href="discover.html">
      &lt;CHAINED&gt;
    </a>
  </header>

  <main class="auth-password-main">
    <section class="auth-password-intro">
      <h1>SET PASSWORD</h1>
    </section>

    <section
      class="auth-panel auth-password-panel"
      aria-labelledby="auth-password-heading">
      <h2 id="auth-password-heading">SECURE YOUR CHAINED ACCOUNT</h2>

      <form class="auth-form" data-password-update-form hidden novalidate>
        <label class="auth-field" for="new-password">
          <span>NEW PASSWORD</span>
          <input
            id="new-password"
            name="new-password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required>
        </label>

        <label class="auth-field" for="confirm-password">
          <span>CONFIRM PASSWORD</span>
          <input
            id="confirm-password"
            name="confirm-password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required>
        </label>

        <button class="auth-submit" type="submit" data-password-update-submit>
          [ SET PASSWORD ]
        </button>
      </form>

      <p
        class="auth-status"
        role="status"
        aria-live="polite"
        data-password-update-status>
        VERIFYING YOUR CHAINED ACCOUNT
      </p>
    </section>
  </main>

  <script type="module" src="auth/password-update.mjs"></script>
</body>
</html>
