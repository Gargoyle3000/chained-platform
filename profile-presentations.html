<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">

  <title>Presentations — CHAINED</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="profile.css">
  <link rel="stylesheet" href="auth/auth.css">
</head>

<body class="profile-page profile-dynamic-page">

  <header class="site-header">
    <a class="wordmark" href="discover.html">&lt;CHAINED&gt;</a>

    <nav class="main-nav" aria-label="Primary navigation">
      <a href="discover.html">DISCOVER</a>
      <a href="following.html">FOLLOWING</a>
      <a href="archive.html">ARCHIVE</a>
      <a href="agenda.html">AGENDA</a>
      <a
        class="is-active"
        id="profile-primary-link"
        data-own-profile-link
        href="profile.html">
        PROFILE
      </a>
    </nav>
  </header>


  <main class="artist-profile">

    <aside class="artist-sidebar">
      <div class="artist-sidebar-inner">

        <header class="artist-intro">
          <h1 id="profile-name">ARTIST PROFILE</h1>

          <p
            class="artist-biography"
            id="profile-biography"
            hidden></p>

          <div
            class="profile-follow"
            id="profile-follow-control"
            hidden>
            <button
              class="text-action"
              id="profile-follow-action"
              type="button"
              aria-label="Follow this artist profile">
              [ FOLLOW ]
            </button>

            <p
              class="profile-follow-status"
              id="profile-follow-status"
              role="status"
              aria-live="polite"></p>
          </div>
        </header>


        <nav
          class="artist-navigation"
          aria-label="Artist profile">
          <a
            id="profile-works-link"
            href="profile.html">
            WORKS
          </a>

          <a
            class="is-active"
            id="profile-presentations-link"
            href="profile-presentations.html">
            PRESENTATIONS
          </a>

          <a
            id="profile-agenda-link"
            href="profile-agenda.html"
            hidden>
            AGENDA
          </a>

          <a
            id="profile-cv-link"
            href="profile-cv.html"
            hidden>
            CV
          </a>
          <a
            id="profile-press-link"
            href="profile-press.html"
            hidden>
            PRESS
          </a>
        </nav>

      </div>
    </aside>


    <section
      class="artist-presentations"
      id="presentations"
      aria-live="polite"
      aria-busy="true">
      <p
        class="profile-works-state"
        role="status">
        LOADING PRESENTATIONS
      </p>
    </section>

  </main>


  <script
    type="module"
    src="profile-presentations.js"></script>

</body>
</html>
