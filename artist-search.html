<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Artist Search — CHAINED</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth/auth.css">
  <link rel="stylesheet" href="artist-search.css">
</head>
<body class="artist-search-page">
  <header class="site-header" data-public-header>
    <a class="wordmark" href="discover.html">&lt;CHAINED&gt;</a>
    <div class="auth-session-indicator public-action-slot">
      <a class="public-header-action" data-anonymous-login href="login.html">[ LOG IN ]</a>
    </div>
    <template data-authenticated-navigation>
      <nav class="main-nav main-nav-with-dashboard" aria-label="Primary navigation">
        <a href="discover.html">DISCOVER</a>
        <a href="following.html">FOLLOW</a>
        <a href="archive.html">SELECTOR</a>
        <a href="agenda.html">AGENDA</a>
        <span class="profile-nav-group">
          <a data-own-profile-link href="profile.html">PROFILE</a>
          <a class="dashboard-link" href="dashboard.html" aria-label="Open dashboard">[+]</a>
        </span>
      </nav>
    </template>
  </header>

  <main class="artist-search-main">
    <a class="text-action artist-search-back" href="discover.html">[ DISCOVER ]</a>
    <h1>ARTIST SEARCH</h1>
    <p class="artist-search-intro">FIND A PUBLISHED ARTIST PROFILE BY NAME OR PROFILE SLUG.</p>
    <form class="artist-search-form" id="artist-search-form" role="search">
      <label for="artist-search-query">ARTIST NAME OR PROFILE SLUG</label>
      <div class="artist-search-input-row">
        <input id="artist-search-query" name="q" type="search" minlength="2" maxlength="100" autocomplete="off">
        <button class="text-action" type="submit">[ SEARCH ]</button>
      </div>
    </form>
    <p class="artist-search-status" id="artist-search-status" role="status" aria-live="polite">ENTER AT LEAST TWO CHARACTERS.</p>
    <ul class="artist-search-results" id="artist-search-results" aria-label="Artist search results"></ul>
  </main>

  <script type="module" src="auth/public-navigation.mjs"></script>
  <script type="module" src="artist-search.mjs"></script>
</body>
</html>
