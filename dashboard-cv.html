<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">

  <title>CV &mdash; CHAINED Dashboard</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="auth/auth.css">

  <script type="module" src="auth/guard.mjs"></script>
</head>

<body class="dashboard-page" data-auth-protected="true">

  <header class="site-header">
    <a class="wordmark" href="discover.html">
      &lt;CHAINED&gt;
    </a>

    <nav
      class="main-nav main-nav-with-dashboard"
      aria-label="Primary navigation">
      <a href="discover.html">DISCOVER</a>
      <a href="following.html">FOLLOWING</a>
      <a href="archive.html">ARCHIVE</a>
      <a href="agenda.html">AGENDA</a>

      <span class="profile-nav-group">
        <a data-own-profile-link href="profile-peer-vink.html">
          PROFILE
        </a>

        <a
          class="dashboard-link is-active"
          href="dashboard.html"
          aria-label="Open dashboard">
          +
        </a>
      </span>
    </nav>
  </header>


  <main class="dashboard-layout">

    <aside class="dashboard-sidebar">
      <div class="dashboard-sidebar-inner">

        <header class="dashboard-intro">
          <h1>DASHBOARD</h1>

          <p
            class="dashboard-account-identity"
            data-dashboard-account-identity>
            <span data-dashboard-profile-name>PROFILE LOADING</span><br>
            <span data-dashboard-account-type>ARTIST ACCOUNT</span>
          </p>
        </header>


        <nav
          class="dashboard-navigation"
          aria-label="Dashboard navigation">
          <a href="dashboard.html">OVERVIEW</a>
          <a href="dashboard-works.html">WORKS</a>
          <a href="dashboard-presentations.html">PRESENTATIONS</a>
          <a href="dashboard-agenda.html">AGENDA</a>

          <a
            class="is-active"
            href="dashboard-cv.html">
            CV
          </a>

          <span>PRESS</span>
          <span>SETTINGS</span>
        </nav>


        <a
          class="dashboard-public-link"
          data-own-profile-link
          href="profile-peer-vink.html">
          VIEW PUBLIC PROFILE &nearr;
        </a>

      </div>
    </aside>


    <section class="dashboard-content">

      <header class="dashboard-content-header">
        <div>
          <p>CV</p>
          <h2>YOUR LIVE CV</h2>
        </div>

        <label
          class="dashboard-cv-profile-switch"
          id="dashboard-cv-profile-field"
          hidden>
          <span>CV FOR</span>

          <select id="dashboard-cv-profile"></select>
        </label>
      </header>


      <p
        class="dashboard-inline-error"
        id="dashboard-cv-error"
        role="alert"
        aria-live="polite"
        hidden></p>

      <p
        class="dashboard-local-notice"
        id="dashboard-cv-notice"
        role="status"
        hidden></p>


      <div
        class="dashboard-cv-live"
        id="dashboard-cv-live"
        aria-live="polite"></div>

    </section>

  </main>

  <script src="dashboard-cv.js?v=2"></script>

</body>
</html>
