<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">

  <title>Works — CHAINED Dashboard</title>

  <link rel="stylesheet" href="styles.css">
  <script src="scroll-indicators.js" defer></script>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="auth/auth.css">

  <script type="module" src="auth/guard.mjs"></script>
</head>

<body class="dashboard-page" data-auth-protected="true">

  <header class="site-header">
    <a class="wordmark" href="discover.html">
      &lt;CHAINED&gt;
    </a>

    <nav
      class="main-nav main-nav-with-dashboard"
      aria-label="Primary navigation">
      <a href="discover.html">DISCOVER</a>
      <a href="following.html">FOLLOWING</a>
      <a href="archive.html">ARCHIVE</a>
      <a href="agenda.html">AGENDA</a>

      <span class="profile-nav-group">
        <a data-own-profile-link href="profile.html">
          PROFILE
        </a>

        <a
          class="dashboard-link is-active"
          href="dashboard.html"
          aria-label="Open dashboard">
          +
        </a>
      </span>
    </nav>
  </header>


  <main class="dashboard-layout">

    <aside class="dashboard-sidebar">
      <div class="dashboard-sidebar-inner">

        <header class="dashboard-intro">
          <div class="dashboard-page-marker" aria-hidden="true">+</div>

          <p class="dashboard-account-identity" data-dashboard-account-identity>
            <span data-dashboard-profile-name>PROFILE LOADING</span><br>
            <span data-dashboard-account-type>ARTIST ACCOUNT</span>
          </p>
        </header>


        <nav
          class="dashboard-navigation"
          aria-label="Dashboard navigation">

          <a href="dashboard.html">
            OVERVIEW
          </a>

          <a
            class="is-active"
            href="dashboard-works.html">
            WORKS
          </a>

          <a href="dashboard-presentations.html">
            PRESENTATIONS
          </a>
          <a href="dashboard-agenda.html">AGENDA</a>
          <a href="dashboard-cv.html">CV</a>
          <a href="dashboard-press.html">PRESS</a>
          <a href="dashboard-settings.html">SETTINGS</a>
        </nav>


        <a
          class="dashboard-public-link"
          data-own-profile-link
          href="profile.html">
          VIEW PUBLIC PROFILE ↗
        </a>

      </div>
    </aside>


    <section class="dashboard-content">

      <header class="dashboard-content-header">
        <div>
          <h2>WORKS</h2>
        </div>

        <div class="dashboard-content-actions">
          <a class="text-action" href="dashboard-portfolio-export.html">[ EXPORT PORTFOLIO ]</a>
          <a class="text-action dashboard-add-work" href="dashboard-work-edit.html">[ + ADD WORK ]</a>
        </div>
      </header>


      <section class="dashboard-section">

        <header class="dashboard-section-header">
          <div>
            <p class="dashboard-label">
              ALL WORKS
            </p>

            <h2 id="dashboard-works-breakdown">
              LOADING WORKS
            </h2>
          </div>

          <span id="dashboard-works-total">—</span>
        </header>

        <p
          class="dashboard-inline-error"
          id="dashboard-works-error"
          role="alert"
          hidden></p>

        <div
          class="dashboard-work-list"
          id="dashboard-work-list"
          aria-live="polite"></div>

      </section>

    </section>

  </main>

  <script src="work-store.js"></script>
  <script src="dashboard-works.js?v=2"></script>

</body>
</html>
