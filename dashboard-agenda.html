<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">

  <title>Agenda &mdash; CHAINED Dashboard</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="auth/auth.css">

  <script type="module" src="auth/guard.mjs"></script>
</head>

<body class="dashboard-page" data-auth-protected="true">

  <header class="site-header">
    <a class="wordmark" href="discover.html">
      &lt;CHAINED&gt;
    </a>

    <nav
      class="main-nav main-nav-with-dashboard"
      aria-label="Primary navigation">
      <a href="discover.html">DISCOVER</a>
      <a href="following.html">FOLLOWING</a>
      <a href="archive.html">ARCHIVE</a>
      <a href="agenda.html">AGENDA</a>

      <span class="profile-nav-group">
        <a data-own-profile-link href="profile-peer-vink.html">
          PROFILE
        </a>

        <a
          class="dashboard-link is-active"
          href="dashboard.html"
          aria-label="Open dashboard">
          +
        </a>
      </span>
    </nav>
  </header>


  <main class="dashboard-layout">

    <aside class="dashboard-sidebar">
      <div class="dashboard-sidebar-inner">

        <header class="dashboard-intro">
          <h1>DASHBOARD</h1>

          <p class="dashboard-account-identity" data-dashboard-account-identity>
            <span data-dashboard-profile-name>PROFILE LOADING</span><br>
            <span data-dashboard-account-type>ARTIST ACCOUNT</span>
          </p>
        </header>


        <nav
          class="dashboard-navigation"
          aria-label="Dashboard navigation">

          <a href="dashboard.html">
            OVERVIEW
          </a>

          <a href="dashboard-works.html">
            WORKS
          </a>

          <a href="dashboard-presentations.html">
            PRESENTATIONS
          </a>

          <a
            class="is-active"
            href="dashboard-agenda.html">
            AGENDA
          </a>

          <a href="dashboard-cv.html">CV</a>
          <span>PRESS</span>
          <span>SETTINGS</span>
        </nav>


        <a
          class="dashboard-public-link"
          data-own-profile-link
          href="profile-peer-vink.html">
          VIEW PUBLIC PROFILE &nearr;
        </a>

      </div>
    </aside>


    <section class="dashboard-content">

      <header class="dashboard-content-header">
        <div>
          <p>AGENDA</p>

          <h2>MANAGE YOUR AGENDA</h2>
        </div>

        <a
          class="text-action dashboard-add-agenda"
          href="dashboard-agenda-edit.html">
          [ + ADD AGENDA ITEM ]
        </a>
      </header>


      <section class="dashboard-section">

        <header class="dashboard-section-header">
          <div>
            <p class="dashboard-label">
              ALL AGENDA ITEMS
            </p>

            <h2 id="dashboard-agenda-breakdown">
              LOADING AGENDA
            </h2>
          </div>

          <span id="dashboard-agenda-total">&mdash;</span>
        </header>

        <p
          class="dashboard-inline-error"
          id="dashboard-agenda-error"
          role="alert"
          hidden></p>

        <p
          class="dashboard-local-notice"
          id="dashboard-agenda-notice"
          role="status"
          hidden></p>

        <div
          class="dashboard-agenda-list"
          id="dashboard-agenda-list"
          aria-live="polite"></div>

      </section>

    </section>
  </main>

  <script src="dashboard-agenda.js?v=1"></script>

</body>
</html>
