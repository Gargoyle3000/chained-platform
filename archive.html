<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">

  <title>Archive — CHAINED</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="archive.css">
  <link rel="stylesheet" href="auth/auth.css">

  <script type="module" src="auth/guard.mjs"></script>
</head>

<body
  class="archive-page"
  data-view="grid"
  data-auth-protected="true">

  <header class="site-header">
    <a class="wordmark" href="discover.html">&lt;CHAINED&gt;</a>

    <nav class="main-nav main-nav-with-dashboard" aria-label="Primary navigation">
      <a href="discover.html">DISCOVER</a>
      <a href="following.html">FOLLOWING</a>
      <a class="is-active" href="archive.html">ARCHIVE</a>
      <a href="agenda.html">AGENDA</a>
      <span class="profile-nav-group">
        <a data-own-profile-link href="profile-peer-vink.html">PROFILE</a>
        <a class="dashboard-link" href="dashboard.html" aria-label="Open dashboard">+</a>
      </span>
    </nav>
  </header>

  <main class="archive-layout">
    <aside class="archive-sidebar">
      <div class="archive-sidebar-inner">
        <section class="archive-sidebar-section">
          <h1>ARCHIVE</h1>
          <p class="archive-status">PRIVATE WORKSPACE</p>
        </section>

        <section class="archive-sidebar-section archive-tags-section" aria-labelledby="archive-tags-heading">
          <h2 id="archive-tags-heading">TAGS</h2>
          <form class="archive-tag-create">
            <label>
              <span class="sr-only">New Archive tag</span>
              <input type="text" name="archive-tag-name" maxlength="80" autocomplete="off" placeholder="TAG NAME" disabled>
            </label>
            <button class="text-action" type="submit" disabled>[ + NEW TAG ]</button>
          </form>
          <p class="archive-tag-message" role="status" hidden></p>
          <button class="archive-tag-clear text-action" type="button" aria-label="Clear Archive tag filters" hidden>[ CLEAR ]</button>
          <div class="archive-tag-list" aria-live="polite"></div>
        </section>
      </div>
    </aside>

    <section class="archive-content" aria-labelledby="archive-current-project">
      <header class="archive-content-header">
        <div>
          <p class="archive-current-project" id="archive-current-project">SAVED WORKS</p>
          <p class="archive-result-count" aria-live="polite">LOADING</p>
        </div>

        <div class="archive-header-tools">
          <div class="archive-view-switch" aria-label="Choose Archive view">
            <span>VIEW:</span>
            <button class="archive-view-button" type="button" data-archive-view="single" aria-pressed="false">SINGLE</button>
            <span>/</span>
            <button class="archive-view-button is-active" type="button" data-archive-view="grid" aria-pressed="true">GRID</button>
            <span>/</span>
            <button class="archive-view-button" type="button" data-archive-view="supergrid" aria-pressed="false">SUPERGRID</button>
          </div>

          <label class="archive-search">
            <span class="sr-only">Search archive</span>
            <input type="search" placeholder="SEARCH ARCHIVE" autocomplete="off" disabled>
          </label>
        </div>
      </header>

      <div class="saved-grid" aria-live="polite" aria-busy="true"></div>
      <p class="archive-empty" hidden></p>
    </section>
  </main>

  <script type="module" src="archive.js"></script>
</body>
</html>
