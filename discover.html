<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">

  <title>Discover — CHAINED</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth/auth.css">
</head>

<body class="discover-page" data-view="single">
  <header class="site-header">
    <a class="wordmark" href="discover.html">&lt;CHAINED&gt;</a>

    <nav class="main-nav main-nav-with-dashboard" aria-label="Primary navigation">
      <a class="is-active" href="discover.html">DISCOVER</a>
      <a href="following.html">FOLLOWING</a>
      <a href="archive.html">ARCHIVE</a>
      <a href="agenda.html">AGENDA</a>
      <span class="profile-nav-group">
        <a data-own-profile-link href="profile.html">PROFILE</a>
        <a class="dashboard-link" href="dashboard.html" aria-label="Open dashboard">+</a>
      </span>
    </nav>
  </header>

  <main class="discover-main">
    <section class="discover-toolbar">
      <div class="discover-toolbar-controls">
        <div class="view-switch" aria-label="Choose view">
          <span>VIEW:</span>
          <button class="view-button is-active" type="button" data-view="single" aria-pressed="true">SINGLE</button>
          <span>/</span>
          <button class="view-button" type="button" data-view="grid" aria-pressed="false">GRID</button>
        </div>

        <div class="discover-filter" hidden>
          <button
            class="text-action discover-filter-trigger"
            type="button"
            aria-expanded="false"
            aria-controls="discover-filter-menu">
            [ FILTER ]
          </button>

          <div class="discover-filter-menu" id="discover-filter-menu" hidden>
            <button class="discover-filter-close" type="button" aria-label="Close filter menu">×</button>
            <div class="discover-filter-options" role="listbox" aria-label="Filter by format or discipline" aria-multiselectable="true"></div>
            <button class="text-action discover-filter-clear" type="button" hidden>[ CLEAR FILTERS ]</button>
          </div>
        </div>
      </div>
    </section>

    <section class="discover-stream" aria-live="polite" aria-busy="false"></section>
  </main>

  <script type="module" src="auth/public-navigation.mjs"></script>
  <script src="discover.js"></script>
  <script src="saved-works.js"></script>
</body>
</html>
